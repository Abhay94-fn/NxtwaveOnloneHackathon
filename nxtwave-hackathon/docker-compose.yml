services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: sevasetu
      POSTGRES_USER: sevasetu
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sevasetu -d sevasetu"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql://sevasetu:${POSTGRES_PASSWORD:-change-me}@postgres:5432/sevasetu
      SEVASETU_JWT_SECRET: ${SEVASETU_JWT_SECRET:?Set SEVASETU_JWT_SECRET}
      SEVASETU_WEBHOOK_SECRET: ${SEVASETU_WEBHOOK_SECRET:?Set SEVASETU_WEBHOOK_SECRET}
      SEVASETU_DOCUMENT_KEY: ${SEVASETU_DOCUMENT_KEY:?Set SEVASETU_DOCUMENT_KEY}
      SEVASETU_ADMIN_EMAIL: ${SEVASETU_ADMIN_EMAIL:?Set SEVASETU_ADMIN_EMAIL}
      SEVASETU_WEBHOOK_TARGET_URL: ${SEVASETU_WEBHOOK_TARGET_URL:-}
      DOCUMENT_STORAGE_DIR: /var/lib/sevasetu/documents
      SOURCE_SYNC_INTERVAL_HOURS: ${SOURCE_SYNC_INTERVAL_HOURS:-24}
      CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS}
    volumes:
      - document_data:/var/lib/sevasetu/documents
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8000"

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    depends_on:
      - backend
    expose:
      - "3000"

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      - frontend
      - backend
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  postgres_data:
  document_data:
  caddy_data:
  caddy_config:
